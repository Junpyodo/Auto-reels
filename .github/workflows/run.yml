name: Auto Reels Uploader

on:
  workflow_dispatch:
  sche(이거지우면 다시 됨)dule:
    # 하루에 두 번 실행 (한국 시간 12:00 PM, 12:00 AM)
    - cron: '0 3,15 * * *' 

jobs:
  build-and-run:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg imagemagick fonts-nanum
          # ImageMagick 보안 정책 수정 (자막 생성을 위해 필수)
          sudo sed -i 's/domain="path" rights="none" pattern="@\*"/domain="path" rights="read|write" pattern="@\*"/g' /etc/ImageMagick-6/policy.xml

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          # moviepy 실행에 필요한 필수 의존성 패키지 일괄 설치
          pip install moviepy==1.0.3 openai requests decorator proglog imageio==2.25.1 imageio-ffmpeg

      - name: Run Reels Script
        env:
          INSTAGRAM_ACCESS_TOKEN: ${{ secrets.INSTAGRAM_ACCESS_TOKEN }}
          INSTAGRAM_ACCOUNT_ID: ${{ secrets.INSTAGRAM_ACCOUNT_ID }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python main.py

      - name: Commit and Push Changes
        if: success()
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          # 대본 기록, 추가 주제, 삭제된 비상 대본 모두 반영
          git add used_scripts.json topics.txt emergency_scripts.txt
          git commit -m "🚀 Content updated (Used scripts & New topics) [skip ci]" || echo "No changes to commit"
          git push origin main
